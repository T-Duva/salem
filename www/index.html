<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Salem 3D</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="icon.png" />
</head>
<body>
  <section id="menu" class="screen active">
    <div class="hero">
      <img src="icon.png" alt="Horca" />
      <h1>SALEM</h1>
      <p>Prueba 3D — joystick · puertas · refugios</p>
      <div class="row" style="width:100%;max-width:320px">
        <button id="btnStart">Iniciar partida</button>
        <button id="btnExit" class="secondary">Salir</button>
      </div>
    </div>
  </section>

  <section id="game" class="screen game3d">
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="hudTop">
        <span class="tag" id="sectorTag">Plaza</span>
        <span class="tag" id="roleTag">—</span>
        <span class="tag" id="timer">30:00</span>
      </div>
      <div id="crierBox"><strong>Pregonero:</strong> <span id="crier">…</span></div>
    </div>
    <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
    <div id="verbBar">
      <button id="btnEnter" disabled>ENTRAR</button>
      <button id="btnNight" class="secondary">Noche / acción</button>
      <button id="btnMenu" class="secondary">Menú</button>
    </div>
    <div id="panel" class="hidden">
      <div id="panelTitle">Noche</div>
      <div id="panelBody"></div>
      <button id="panelClose" class="secondary">Cerrar</button>
    </div>
  </section>

  <section id="end" class="screen">
    <div class="hero">
      <h1 id="endTitle">Fin</h1>
      <p id="endText"></p>
      <button id="btnAgain">Volver al menú</button>
    </div>
  </section>

  <div id="toast"></div>
  <script src="lib/three.min.js"></script>
  <script src="game3d.js"></script>
</body>
</html>
